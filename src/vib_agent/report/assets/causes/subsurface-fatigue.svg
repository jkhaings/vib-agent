<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 252" width="100%" role="img" aria-labelledby="t d" style="font-family:"IBM Plex Sans", system-ui, sans-serif"><title id="t">Subsurface fatigue</title><desc id="d">A rolling contact with its peak stress below the surface, a crack propagating from that depth, and the resulting surface spall.</desc><rect x="0" y="0" width="340" height="252" fill="#FFFFFF"/><rect x="26" y="96" width="288" height="76" fill="#F6F7F5" stroke="#101816" stroke-width="1.4"/><circle cx="112" cy="72" r="21" fill="#FFFFFF" stroke="#101816" stroke-width="1.5"/><line x1="112.0" y1="34.0" x2="112.0" y2="50.0" stroke="#101816" stroke-width="1.5"/><path d="M 112.0 50.0 L 110.0 45.4 L 114.0 45.4 Z" fill="#101816"/><text x="140.0" y="42.0" text-anchor="start" font-size="10.64" fill="#5A6662" font-weight="400">load</text><ellipse cx="112" cy="116" rx="26" ry="15" fill="none" stroke="#B3372B" stroke-width="1.5" stroke-dasharray="4 3"/><text x="112.0" y="120.0" text-anchor="middle" font-size="10.08" fill="#B3372B" font-weight="400">peak stress</text><text x="112.0" y="148.0" text-anchor="middle" font-size="10.08" fill="#5A6662" font-weight="400">below the surface</text><path d="M 244 126 L 238 112 L 250 102 L 242 96" fill="none" stroke="#B3372B" stroke-width="1.8"/><path d="M 232 96 q 12 11 24 0" fill="none" stroke="#B3372B" stroke-width="2.2"/><circle cx="244" cy="126" r="3" fill="#B3372B"/><text x="244.0" y="84.0" text-anchor="middle" font-size="10.64" fill="#B3372B" font-weight="600">crack reaches the surface</text><text x="244.0" y="150.0" text-anchor="middle" font-size="10.64" fill="#B3372B" font-weight="600">spall</text><text x="170.0" y="238.0" text-anchor="middle" font-size="11.20" fill="#5A6662" font-weight="400">the crack starts where the stress is highest — under the skin</text></svg>
