<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 252" width="100%" role="img" aria-labelledby="t d" style="font-family:"IBM Plex Sans", system-ui, sans-serif"><title id="t">Debris denting</title><desc id="d">A single hard particle being over-rolled, leaving discrete dents in the raceway behind the rolling element.</desc><rect x="0" y="0" width="340" height="252" fill="#FFFFFF"/><rect x="26" y="136" width="288" height="26" fill="#F6F7F5" stroke="#101816" stroke-width="1.4"/><text x="170.0" y="178.0" text-anchor="middle" font-size="10.64" fill="#5A6662" font-weight="400">raceway</text><circle cx="170" cy="114" r="21" fill="#FFFFFF" stroke="#101816" stroke-width="1.5"/><text x="170.0" y="117.0" text-anchor="middle" font-size="10.64" fill="#5A6662" font-weight="400">ball</text><line x1="170.0" y1="72.0" x2="170.0" y2="90.0" stroke="#101816" stroke-width="1.5"/><path d="M 170.0 90.0 L 168.0 85.4 L 172.0 85.4 Z" fill="#101816"/><text x="196.0" y="80.0" text-anchor="start" font-size="10.64" fill="#5A6662" font-weight="400">load</text><circle cx="228" cy="130" r="4.6" fill="#B3372B"/><path d="M 120 136 q 6 7 12 0" fill="none" stroke="#B3372B" stroke-width="1.8"/><path d="M 74 136 q 6 7 12 0" fill="none" stroke="#B3372B" stroke-width="1.8"/><text x="228.0" y="112.0" text-anchor="middle" font-size="10.64" fill="#B3372B" font-weight="600">hard particle</text><text x="100.0" y="196.0" text-anchor="middle" font-size="10.64" fill="#B3372B" font-weight="600">discrete dents left behind</text><text x="170.0" y="238.0" text-anchor="middle" font-size="11.20" fill="#5A6662" font-weight="400">one over-rolled particle leaves a dent, not a wear track</text></svg>
