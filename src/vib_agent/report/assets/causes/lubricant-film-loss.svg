<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 252" width="100%" role="img" aria-labelledby="t d" style="font-family:"IBM Plex Sans", system-ui, sans-serif"><title id="t">Loss of the lubricant film</title><desc id="d">A raceway where the separating oil film thins to nothing, leaving direct metal-to-metal contact.</desc><rect x="0" y="0" width="340" height="252" fill="#FFFFFF"/><rect x="26" y="136" width="288" height="26" fill="#F6F7F5" stroke="#101816" stroke-width="1.4"/><text x="170.0" y="178.0" text-anchor="middle" font-size="10.64" fill="#5A6662" font-weight="400">raceway</text><circle cx="150" cy="114" r="21" fill="#FFFFFF" stroke="#101816" stroke-width="1.5"/><text x="150.0" y="117.0" text-anchor="middle" font-size="10.64" fill="#5A6662" font-weight="400">ball</text><line x1="150.0" y1="72.0" x2="150.0" y2="90.0" stroke="#101816" stroke-width="1.5"/><path d="M 150.0 90.0 L 148.0 85.4 L 152.0 85.4 Z" fill="#101816"/><text x="176.0" y="80.0" text-anchor="start" font-size="10.64" fill="#5A6662" font-weight="400">load</text><rect x="130" y="133" width="80" height="3.4" fill="#0B63C5" opacity="0.55"/><rect x="222" y="135.6" width="80" height="0.9" fill="#B3372B"/><text x="170.0" y="194.0" text-anchor="middle" font-size="10.64" fill="#0B63C5" font-weight="600">film separates</text><line x1="170.0" y1="184.0" x2="170.0" y2="140.0" stroke="#0B63C5" stroke-width="0.9"/><text x="252.0" y="214.0" text-anchor="middle" font-size="10.64" fill="#B3372B" font-weight="600">film gone — metal to metal</text><line x1="252.0" y1="204.0" x2="262.0" y2="140.0" stroke="#B3372B" stroke-width="0.9"/><text x="170.0" y="238.0" text-anchor="middle" font-size="11.20" fill="#5A6662" font-weight="400">film thickness falls below the surface roughness</text></svg>
